<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <form>
            <div class="userInfo">
                <h1>Cadastro de Usuário</h1>
                    <label for="nome">Nome </label>
                    <input id="nome" type="text" required>
                    <label for="sobrenome">Sobrenome </label>
                    <input id="sobrenome" type="text" required>
                    <label for="email">E-mail </label>
                    <input id="email" type="text" required>
                    <label for="telefone">Telefone </label>
                    <input id="telefone" type="text" required>
            </div>
            <div class="adressInfo">
                <h1>Cadastro de endereço</h1>
                    <label for="cep">CEP </label>
                    <input id="cep" type="number" required>
                    <label for="logradouro">Logradouro </label>
                    <input id="logradouro" type="text" required>
                    <label for="bairro">Bairro </label>
                    <input id="bairro" type="text" required>
                    <label for="cidade">Cidade </label>
                    <input id="cidade" type="text" required>
                    <label for="uf">Estado </label>
                    <input id="uf" type="text" required>
                    <label for="numero">Número </label>
                    <input id="numero" type="text" required>             
                    <button type="submit" id="cadastro">Cadastrar</button>
            </div>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
